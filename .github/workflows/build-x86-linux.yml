name: Build x86_64 Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- 前端 ---
      - uses: pnpm/action-setup@v4
        with:
          version: 'latest'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          # pnpm v10+ 需要显式允许 esbuild 原生模块构建
          jq '.pnpm.onlyBuiltDependencies |= (if . then . + ["esbuild"] | unique else ["esbuild"] end)' package.json > tmp.json && mv tmp.json package.json
          pnpm install --frozen-lockfile
          pnpm run build

      # --- 后端 ---
      - name: Build backend (x86_64 musl)
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cd backend
          cargo build --release --target x86_64-unknown-linux-musl

      # --- 发布 ---
      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/target/x86_64-unknown-linux-musl/release/simadmin

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: simadmin-x86_64-linux
          path: backend/target/x86_64-unknown-linux-musl/release/simadmin
